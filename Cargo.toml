[package]
name = "pic64gx"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/luphiax/pic64gx"
description = "Minimal PAC scaffold for PIC64GX baremetal Rust bring-up."
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["riscv", "pac", "pic64gx", "uart"]
rust-version = "1.76"

[dependencies]
critical-section = { version = "1", optional = true }
riscv = "0.12"
riscv-rt = { version = "0.13", optional = true, features = ["no-interrupts", "single-hart"] }
vcell = "0.1.3"

[features]
critical-section = ["dep:critical-section"]
rt = ["riscv-rt"]
v-trap = ["rt", "riscv-rt/v-trap"]
